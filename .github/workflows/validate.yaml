name: Validate

on:
  pull_request:
    branches: [master, hmg, homol, main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, jest and eslint against the baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          CI: true
      - name: Validate
        run: npm run validate
